# Optimisation des images (redimensionnement + compression + WebP).
# Les miniatures sont générées à la première visite puis servies depuis public/media/cache.
liip_imagine:
    driver: gd
    twig:
        mode: lazy

    resolvers:
        default:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: media/cache

    loaders:
        default:
            filesystem:
                data_root: '%kernel.project_dir%/public'

    # Toutes les miniatures sont converties en WebP (≈ 30 % plus léger que JPEG,
    # pris en charge par tous les navigateurs actuels). L'extension du fichier
    # d'origine est conservée : public/.htaccess force le bon type MIME.
    # On n'active pas "webp.generate" : il ferait passer chaque image par PHP + une redirection.
    default_filter_set_settings:
        format: webp
        quality: 80
        jpeg_quality: 80
        png_compression_level: 8

    filter_sets:
        # Cartes (services, réalisations) – 16:10
        card:
            filters:
                auto_rotate: ~
                thumbnail: { size: [640, 400], mode: outbound }

        # Grande image des pages de détail
        detail:
            quality: 75
            filters:
                auto_rotate: ~
                interlace: { mode: line }
                relative_resize: { widen: 1200 }
                downscale: { max: [1200, 900] }

        # Image de partage réseaux sociaux (Open Graph)
        og_image:
            filters:
                auto_rotate: ~
                thumbnail: { size: [1200, 630], mode: outbound }

        # Galerie – miniature carrée et vue agrandie
        gallery_thumb:
            filters:
                auto_rotate: ~
                thumbnail: { size: [480, 480], mode: outbound }
        gallery_large:
            quality: 75
            filters:
                auto_rotate: ~
                downscale: { max: [1600, 1200] }

        # Photos de l'équipe
        avatar:
            filters:
                auto_rotate: ~
                thumbnail: { size: [240, 240], mode: outbound }

        # Logos partenaires / icônes réseaux sociaux
        logo:
            filters:
                downscale: { max: [240, 120] }
        icon:
            filters:
                thumbnail: { size: [64, 64], mode: inset }

        # Image de remplacement / poster de la vidéo d'accueil
        hero:
            filters:
                auto_rotate: ~
                thumbnail: { size: [1600, 900], mode: outbound }
