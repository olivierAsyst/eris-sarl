# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: 'session.handler.native_file'
        save_path: '%kernel.project_dir%/var/sessions'
        cookie_secure: auto
        cookie_samesite: lax
    csrf_protection:
        enabled: true

    # Version ajoutée aux URL des CSS/JS (?v=...) : à incrémenter après chaque mise à jour
    # de public/css/app.css ou public/js/app.js pour forcer les navigateurs à recharger.
    assets:
        version: '2026.10.3'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
